name: Build and Deploy to EC2

on:
  push:
    branches: [ "prod" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            rajendrasingh23012005/fake_product_detector-web:multistage
            rajendrasingh23012005/fake_product_detector-web:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-0f084632af44dd786" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["docker pull rajendrasingh23012005/fake_product_detector-web:multistage","cd /home/ubuntu && docker compose up -d --force-recreate","docker image prune -f"]}' \
            --region ap-south-1